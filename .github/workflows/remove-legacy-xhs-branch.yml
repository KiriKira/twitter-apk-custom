name: Remove Legacy XHS Branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-legacy-xhs-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete old XHS branch
        shell: bash
        run: git push origin --delete xhs-foldable-patch
