name: Build Twitter APK

on:
  # Poll the custom Piko source: every new main commit gets one release.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: "Direct URL for the unpatched X/Twitter APK, APKM, APKS, or XAPK"
        required: false
        type: string
      base_apk_version:
        description: "Version label used for output filenames, for example 12.0.0-release.0"
        required: false
        type: string
      version_code_offset:
        description: "Positive versionCode offset for direct APK updates; defaults to this Actions run number"
        required: false
        type: string
      piko_repository:
        description: "Private Piko repository to build patches from"
        required: true
        default: "KiriKira/piko-custom"
        type: string
      piko_ref:
        description: "Branch, tag, or SHA in the private Piko repository"
        required: true
        default: "main"
        type: string
      build_variants:
        description: "Comma-separated: x,x-material,twitter,twitter-material,all"
        required: true
        default: "x"
        type: string
      create_release:
        description: "Create or update a GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, used only when create_release=true"
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check custom Piko upstream
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.state.outputs.release_tag }}
      should_build: ${{ steps.state.outputs.should_build }}
      piko_sha: ${{ steps.state.outputs.piko_sha }}
    steps:
      - name: Checkout current custom Piko source
        uses: actions/checkout@v7
        with:
          repository: KiriKira/piko-custom
          ref: main
          path: piko
          token: ${{ secrets.PIKO_REPO_TOKEN }}

      - name: Skip source revisions that already have a release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git -C piko rev-parse --short=12 HEAD)"
          tag="piko-custom-${sha}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "$status" in
            200) should_build=false ;;
            404) should_build=true ;;
            *) echo "Unable to check release tag $tag (HTTP $status)" >&2; exit 1 ;;
          esac
          echo "piko_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    needs: check-upstream
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-upstream.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7

      - name: Checkout custom Piko
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'schedule' && 'KiriKira/piko-custom' || inputs.piko_repository }}
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.piko_ref }}
          path: piko
          token: ${{ secrets.PIKO_REPO_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build custom Piko patches
        working-directory: piko
        env:
          GITHUB_TOKEN: ${{ secrets.PIKO_REPO_TOKEN }}
        run: ./gradlew clean buildAndroid

      - name: Stage Piko patch bundle
        run: |
          mkdir -p bins
          cp piko/patches/build/libs/*.mpp bins/patches.mpp

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ks_pkcs12.keystore

      - name: Build patched APK
        env:
          BASE_APK_URL: ${{ inputs.base_apk_url }}
          BASE_APK_VERSION: ${{ inputs.base_apk_version }}
          VERSION_CODE_OFFSET: ${{ inputs.version_code_offset || github.run_number }}
          DEFAULT_BASE_APK_URL: ${{ secrets.BASE_APK_URL }}
          PIKO_MPP_PATH: bins/patches.mpp
          BUILD_VARIANTS: ${{ inputs.build_variants }}
          SIGNING_KEYSTORE_PATH: ks_pkcs12.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$BASE_APK_URL" ]; then
            export BASE_APK_URL="$DEFAULT_BASE_APK_URL"
          fi
          python build_ci.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: patched-twitter-apk
          path: output_apks/*.apk

      - name: Publish release
        if: ${{ github.event_name == 'schedule' || inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'schedule' && needs.check-upstream.outputs.release_tag || inputs.release_tag }}
          name: ${{ github.event_name == 'schedule' && format('Piko custom {0}', needs.check-upstream.outputs.piko_sha) || inputs.release_tag }}
          body: |
            Automated build from custom Piko commit `${{ needs.check-upstream.outputs.piko_sha }}`.
          files: output_apks/*.apk
          overwrite_files: false
          fail_on_unmatched_files: true
